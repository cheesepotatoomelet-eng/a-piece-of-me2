services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5433:5432" # ホスト5433 → コンテナ5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fastapi_app
    restart: always
    ports:
      - "8001:8001" # ホスト8001 → コンテナ8001
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mydb
      SECRET_KEY: "dev-secret-key-change-in-production"   # ← 追加（開発用。任意の文字列でOK）
      ALGORITHM: "HS256"                                  # ← 追加
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"                   # ← 追加   
    depends_on:
      - db
    volumes:
      - ./backend:/app # ホットリロード用

  frontend:
    build: ./frontend
    container_name: nextjs_app
    restart: always
    ports:
      - "3001:3001" # ホスト3001 → コンテナ3001
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules # node_modules はコンテナ内を優先

# トップレベルの volumes 宣言（必須）
# これがないと "refers to undefined volume" エラーが発生します
volumes:
  postgres_data: